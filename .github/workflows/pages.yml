name: Publish to GitHub Pages

# GitHub Pages serves this repo from the gh-pages branch. This workflow
# keeps gh-pages pointing at the latest app commit, so every push to the
# app branch updates the live site automatically.

on:
  push:
    branches: ["claude/bank-it-game-app-b85cwx"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push this commit to gh-pages
        run: git push --force origin HEAD:gh-pages
